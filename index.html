<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070506">
  <title>Un Show Más · Accesos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Gochi+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>
  </div>
  <div id="screenFlash" class="screen-flash" aria-hidden="true"></div>

  <main class="app">
    <header class="top">
      <h1 class="show">UN SHOW MÁS</h1>
      <p class="sub"><span class="dot"></span>CONTROL DE ACCESOS<span class="dot"></span></p>
    </header>

    <section class="stats">
      <div class="stat">
        <span id="used" class="num">–</span>
        <small>INGRESARON <em id="usedOf">/150</em></small>
      </div>
      <div class="stat">
        <span id="available" class="num">–</span>
        <small>DISPONIBLES</small>
      </div>
      <div class="bar"><div id="barFill" class="bar-fill"></div></div>
    </section>

    <section id="result" class="result idle" aria-live="assertive">
      <div id="resultTitle" class="result-title">LISTO</div>
      <div id="resultSub" class="result-sub">Toca ESCANEAR QR para empezar</div>
    </section>

    <div id="readerWrap" class="reader-wrap hidden">
      <div id="reader" class="reader"></div>
      <div class="frame" aria-hidden="true"><b></b><b></b><b></b><b></b><span class="laser"></span></div>
    </div>

    <ul id="history" class="history"></ul>

    <div class="actions">
      <button id="btnStart" class="btn primary">ESCANEAR QR</button>
      <button id="btnStop" class="btn stop hidden">DETENER CÁMARA</button>
    </div>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
